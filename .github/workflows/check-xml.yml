# https://docs.github.com/en/actions
# Vérifie que l'ossature des blocs des fichiers .xml touchés par une PR reste un
# miroir de doc-en. Chaque fichier est comparé au doc-en à la révision qu'il dit
# mirrorer (EN-Revision), donc un fichier en retard ne produit pas de faux
# positif. Le script émet ses annotations ::error lui-même.
#
# Le script est celui de doc-base, partagé par toutes les traductions, et non
# plus une copie propre à ce dépôt.

name: "Structure"

on:
  pull_request:
    branches: ["master"]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  structure:
    name: "Check XML"
    runs-on: ubuntu-22.04
    steps:
      # fr/, en/ et doc-base/ côte à côte : c'est l'arborescence attendue par
      # les scripts de doc-base, la même que celle du workflow de build. Le ref
      # explicite prend la tête réelle de la PR, et non le commit de fusion que
      # actions/checkout construit par défaut : ce dernier a master pour
      # deuxième parent, donc le diff plus bas y verrait aussi tous les
      # fichiers arrivés sur master depuis le dernier push de la PR.

      - name: "Checkout php/doc-fr"
        uses: actions/checkout@v4
        with:
          path: fr
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: "Checkout php/doc-en"
        uses: actions/checkout@v4
        with:
          path: en
          repository: php/doc-en
          fetch-depth: 0

      # TEMPORAIRE : le script vit pour l'instant sur la pull request qui
      # l'ajoute à doc-base. À retirer, avec le ref, une fois celle-ci mergée.

      - name: "Checkout php/doc-base"
        uses: actions/checkout@v4
        with:
          path: doc-base
          repository: php/doc-base
          ref: refs/pull/342/head

      - name: "Check structure"
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          git -C fr fetch --no-tags --depth=1 origin "$BASE"
          git -C fr diff --name-only "$BASE"...HEAD -- '*.xml' \
            | php8.1 doc-base/scripts/translation/check-structure.php \
                --lang=fr --github
